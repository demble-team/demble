name: 想法与建议
description: 说说哪里用起来不顺，或者你想试试什么。
title: "[想法] "
labels: [功能建议]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 当时在做什么，哪里不顺？请给一个具体例子。
      placeholder: 换一个 AI 编程工具，就得重新解释一遍项目背景……
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 这个问题影响了什么？
      description: 比如多花了多少时间、遗漏了什么信息，或者影响了谁。
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: 你想怎么试？
      description: 如果有方案，可以用什么小 Demo 或试验看看它有没有帮助？
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: 怎样算有帮助？
      description: 写一个实际能检查的结果；暂时不确定也可以。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 提交前确认
      options:
        - label: 内容不含密钥、个人数据和私有编程会话。
          required: true
