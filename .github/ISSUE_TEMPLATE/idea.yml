name: 想法或实验建议
description: 描述一个真实协作问题，并提出验证方案的小实验。
title: "[想法] "
labels: [功能建议]
body:
  - type: textarea
    id: problem
    attributes:
      label: 遇到了什么问题？
      description: 描述人类与编码智能体共同开发时的真实协作困难。
      placeholder: 我们不得不向三个不同的智能体重复解释同一个决定……
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: 为什么值得解决？
      description: 这个问题带来了哪些时间、上下文或协调成本？
    validations:
      required: true
  - type: textarea
    id: experiment
    attributes:
      label: 最小验证实验
      description: 能否通过一个演示或范围明确的原型验证这个想法？
    validations:
      required: false
  - type: textarea
    id: outcome
    attributes:
      label: 成功的证据
      description: 出现什么可观察结果，才能说明这个方案有帮助？
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私检查
      options:
        - label: 我已移除密钥、个人数据和私有智能体会话记录。
          required: true
