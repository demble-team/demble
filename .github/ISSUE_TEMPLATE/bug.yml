name: Bug report
description: Report a reproducible problem in an available prototype or release.
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: Explain the observed behavior.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open ...\n2. Select ...\n3. Observe ..."
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: Commit hash or prototype name
    validations:
      required: false
  - type: checkboxes
    id: sensitivity
    attributes:
      label: Security and privacy check
      options:
        - label: This report contains no secrets, private team content, or security vulnerability details.
          required: true
