name: 问题反馈
description: 报告现有原型或版本中能够复现的问题。
title: "[问题] "
labels: [问题]
body:
  - type: textarea
    id: summary
    attributes:
      label: 出现了什么问题？
      description: 请描述实际观察到的行为。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤
      placeholder: "1. 打开……\n2. 选择……\n3. 观察……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 提交哈希或原型名称
    validations:
      required: false
  - type: checkboxes
    id: sensitivity
    attributes:
      label: 安全与隐私检查
      options:
        - label: 此报告不包含密钥、私有团队内容或安全漏洞细节。
          required: true
