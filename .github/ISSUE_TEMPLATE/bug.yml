name: 问题反馈
description: 使用原型或已发布版本时遇到了问题，可以在这里反馈。
title: "[问题] "
labels: [问题]
body:
  - type: textarea
    id: summary
    attributes:
      label: 出现了什么问题？
      description: 你看到了什么？有截图或报错时可以一起附上。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 怎么重现？
      placeholder: "1. 打开……\n2. 选择……\n3. 观察……"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 你原本期望怎样？
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: 版本或提交
      placeholder: 提交哈希或原型名称
    validations:
      required: false
  - type: checkboxes
    id: sensitivity
    attributes:
      label: 提交前确认
      options:
        - label: 内容不含密钥和私人资料；安全漏洞请走私密报告入口。
          required: true
